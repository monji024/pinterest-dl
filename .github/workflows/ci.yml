name: CI

on:
  push:
    branches: [main, 'maint/**', 'fix/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.0', '3.1', '3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Check Ruby syntax
        run: |
          ruby -c bin/pinterest-dl
          find lib test -name '*.rb' -print0 | xargs -0 -n1 ruby -c
      - name: Run test suite with coverage
        env:
          COVERAGE: '1'
        run: bundle exec rake test

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  package:
    name: Build & Install Gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build, install, and smoke-test gem
        run: |
          gem build pinterest-dl.gemspec
          gem install ./pinterest-dl-*.gem --no-document
          ruby -e "require 'pinterest-dl'; abort('version mismatch') unless PinterestDL::VERSION == '2.4.0'"
          pinterest-dl --version
          pinterest-dl --help
          rm -f ./pinterest-dl-*.gem
