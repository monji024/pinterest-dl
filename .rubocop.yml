AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'pkg/**/*'
    - 'coverage/**/*'

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 55

Metrics/AbcSize:
  Max: 55

Metrics/CyclomaticComplexity:
  Max: 20

Metrics/PerceivedComplexity:
  Max: 20

Metrics/ClassLength:
  Max: 450

Metrics/ModuleLength:
  Max: 300

Metrics/ParameterLists:
  Max: 10
  CountKeywordArgs: false

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - 'pinterest-dl.gemspec'
    - 'lib/pinterest_dl/cli.rb'

Layout/LineLength:
  Max: 140
  Exclude:
    - 'test/**/*'
